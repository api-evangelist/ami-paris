name: AMI Paris
description: >-
  AMI Paris is a French contemporary ready-to-wear fashion house founded in 2011
  by Alexandre Mattiussi and headquartered in Paris, known for its "Ami de coeur"
  heart logo. It sells menswear, womenswear, and accessories direct-to-consumer
  through amiparis.com, an online store built on Shopify. The store exposes a real
  agent-commerce surface: a Universal Commerce Protocol (UCP, ucp.dev) MCP endpoint
  advertised in /.well-known/ucp, a published /llms.txt and /agents.md with agent
  instructions, Shopify Customer Account OIDC/OAuth2 authentication, and read-only
  product/collection JSON endpoints. It was surfaced as a portfolio company of
  HongShan (Sequoia China) and profiled by the API Evangelist enrichment pipeline.
